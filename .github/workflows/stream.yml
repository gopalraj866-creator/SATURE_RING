name: Stream Saturn Live to YouTube

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Stream duration in minutes (max ~330)"
        required: true
        default: "60"
      resolution:
        description: "Resolution"
        required: true
        default: "1920x1080"
        type: choice
        options: ["1280x720", "1920x1080"]
      fps:
        description: "FPS"
        required: true
        default: "30"
        type: choice
        options: ["24", "30"]

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xvfb x11-utils ffmpeg chromium-browser \
            fonts-liberation libnss3 libatk-bridge2.0-0 libgtk-3-0 \
            libx11-xcb1 libxcb-dri3-0 libdrm2 libgbm1 || true
          # fallback package names on newer ubuntu
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xvfb x11-utils ffmpeg chromium-browser 2>/dev/null || \
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            xvfb x11-utils ffmpeg chromium 2>/dev/null || true

      - name: Start HTTP server
        run: |
          python3 -m http.server 8080 --directory . &
          echo $! > /tmp/http.pid
          sleep 2
          curl -sf http://127.0.0.1:8080/ >/dev/null && echo "Server OK"

      - name: Start Xvfb
        run: |
          RES="${{ github.event.inputs.resolution }}"
          W=$(echo $RES | cut -d x -f1)
          H=$(echo $RES | cut -d x -f2)
          Xvfb :99 -screen 0 ${W}x${H}x24 -ac +extension GLX +render -noreset &
          echo $! > /tmp/xvfb.pid
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Launch Chromium (kiosk)
        run: |
          RES="${{ github.event.inputs.resolution }}"
          W=$(echo $RES | cut -d x -f1)
          H=$(echo $RES | cut -d x -f2)
          CHROME=$(command -v chromium-browser || command -v chromium || command -v google-chrome)
          $CHROME \
            --display=:99 \
            --no-sandbox \
            --disable-dev-shm-usage \
            --enable-webgl \
            --ignore-gpu-blocklist \
            --use-gl=angle \
            --use-angle=swiftshader-webgl \
            --window-size=${W},${H} \
            --window-position=0,0 \
            --kiosk \
            --app=http://127.0.0.1:8080/ \
            --disable-infobars \
            --no-first-run \
            --autoplay-policy=no-user-gesture-required \
            --disable-background-timer-throttling \
            > /tmp/chrome.log 2>&1 &
          echo $! > /tmp/chrome.pid
          sleep 15
          echo "Chrome PID $(cat /tmp/chrome.pid)"
          tail -15 /tmp/chrome.log || true

      - name: FFmpeg → YouTube RTMP
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          YOUTUBE_RTMP_URL: ${{ secrets.YOUTUBE_RTMP_URL }}
        run: |
          if [ -z "$YOUTUBE_STREAM_KEY" ]; then
            echo "::error::Missing secret YOUTUBE_STREAM_KEY"
            exit 1
          fi
          BASE="${YOUTUBE_RTMP_URL:-rtmp://a.rtmp.youtube.com/live2}"
          DEST="${BASE}/${YOUTUBE_STREAM_KEY}"
          RES="${{ github.event.inputs.resolution }}"
          FPS="${{ github.event.inputs.fps }}"
          MINS="${{ github.event.inputs.duration_minutes }}"
          SECS=$((MINS * 60))
          echo "Streaming ${RES} @ ${FPS}fps for ${MINS} min → YouTube"
          timeout $SECS ffmpeg -y \
            -f x11grab -framerate $FPS -video_size $RES -i :99.0 \
            -f lavfi -i anullsrc=channel_layout=stereo:sample_rate=44100 \
            -c:v libx264 -preset veryfast -tune zerolatency \
            -b:v 4500k -maxrate 4500k -bufsize 9000k \
            -pix_fmt yuv420p -g $((FPS*2)) \
            -c:a aac -b:a 128k -ar 44100 \
            -f flv "$DEST" 2>&1 | tee /tmp/ffmpeg.log || true

      - name: Cleanup
        if: always()
        run: |
          kill $(cat /tmp/chrome.pid) 2>/dev/null || true
          kill $(cat /tmp/xvfb.pid) 2>/dev/null || true
          kill $(cat /tmp/http.pid) 2>/dev/null || true
